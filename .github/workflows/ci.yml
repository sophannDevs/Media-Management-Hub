name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediaflow
          POSTGRES_PASSWORD: mediaflow
          POSTGRES_DB: mediaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediaflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mediaflow:mediaflow@localhost:5432/mediaflow
      # Server the integration tests create their throwaway databases on
      TEST_DATABASE_URL: postgresql://mediaflow:mediaflow@localhost:5432/postgres
      E2E_DATABASE_URL: postgresql://mediaflow:mediaflow@localhost:5432/mediaflow_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pg_dump / pg_restore of the same major version as the server (the backup tests skip without them)
      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production dependency advisories
        run: node scripts/audit-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (build, accessibility, smoke)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
